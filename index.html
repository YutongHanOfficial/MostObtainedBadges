<script>

const inputArea = document.getElementById('inputArea');
const parseBtn = document.getElementById('parseBtn');
const fetchBtn = document.getElementById('fetchBtn');
const clearBtn = document.getElementById('clearBtn');
const loadSample = document.getElementById('loadSample');
const statusEl = document.getElementById('status');
const table = document.getElementById('badgesTable');
const tbody = table.querySelector('tbody');
const progressBar = document.getElementById('progressBar');
const toggleAuto = document.getElementById('toggleAuto');
const intervalInput = document.getElementById('intervalInput');

let badges = [];
let autoTimer = null;
let isFetching = false;


/*
 * IMPORTANT:
 * Replace this with your deployed Google Apps Script Web App URL.
 *
 * Example:
 * https://script.google.com/macros/s/ABC123.../exec
 */
const APPS_SCRIPT_URL =
  'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';


/* ---------------------------------------------------------
   PARSE INPUT
--------------------------------------------------------- */

function parseInputText(text) {
  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  const parsed = [];

  for (const line of lines) {

    // Supports:
    // Game,Badge Name,BadgeID
    //
    // Also supports quoted CSV fields.
    const parts =
      line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g)
        ?.map(s => s.replace(/^"|"$/g, '').trim())
      || [];

    const game = parts[0] || '';
    const name = parts[1] || '';

    // Third column is ALWAYS treated as the badge ID.
    // This avoids the old ID/count guessing problem.
    const id = (parts[2] || '').replace(/\D/g, '');

    if (game || name || id) {
      parsed.push({
        game,
        name,
        id,
        count: null,
        lastFetched: null,
        error: null
      });
    }
  }

  return parsed;
}


/* ---------------------------------------------------------
   RENDER TABLE
--------------------------------------------------------- */

function renderTable() {

  tbody.innerHTML = '';

  if (badges.length === 0) {
    table.style.display = 'none';
    statusEl.textContent = 'No badges parsed yet.';
    return;
  }

  table.style.display = '';

  const sorted = [...badges].sort((a, b) => {

    const ca = a.count == null ? -1 : Number(a.count);
    const cb = b.count == null ? -1 : Number(b.count);

    return cb - ca;
  });

  sorted.forEach((b, index) => {

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${index + 1}</td>

      <td>
        ${escapeHtml(b.game || '—')}
      </td>

      <td>
        ${escapeHtml(b.name || '—')}
      </td>

      <td>
        ${
          b.id
            ? `<code>${escapeHtml(b.id)}</code>`
            : `<span class="small">missing</span>`
        }
      </td>

      <td class="count">
        ${
          b.count == null
            ? '—'
            : numberWithCommas(b.count)
        }
      </td>

      <td>
        ${
          b.lastFetched
            ? new Date(b.lastFetched).toLocaleString()
            : '—'
        }
      </td>
    `;

    tbody.appendChild(tr);
  });

  const withIds = badges.filter(b => b.id).length;

  const errors = badges.filter(b => b.error).length;

  statusEl.textContent =
    `Parsed ${badges.length} badges. ` +
    `${withIds} have IDs.` +
    (errors ? ` ${errors} failed.` : '');
}


/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function numberWithCommas(value) {

  if (value == null) {
    return value;
  }

  return Number(value).toLocaleString();
}


function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,
    c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c])
  );
}


function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}


/* ---------------------------------------------------------
   FETCH ONE BADGE
--------------------------------------------------------- */

async function fetchBadge(badgeId) {

  if (!badgeId) {
    throw new Error('Missing badge ID');
  }

  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.includes('PASTE_YOUR')
  ) {
    throw new Error(
      'Set APPS_SCRIPT_URL to your deployed Apps Script URL'
    );
  }

  const url =
    APPS_SCRIPT_URL +
    '?badgeId=' +
    encodeURIComponent(badgeId) +
    '&_=' +
    Date.now();

  const response = await fetch(url, {
    method: 'GET',
    cache: 'no-store'
  });

  if (!response.ok) {
    throw new Error(
      'Apps Script HTTP ' + response.status
    );
  }

  const data = await response.json();

  if (!data.success) {
    throw new Error(
      data.error || 'Badge lookup failed'
    );
  }

  if (
    typeof data.awardedCount !== 'number'
  ) {
    throw new Error(
      'No awardedCount returned'
    );
  }

  return {
    count: data.awardedCount,
    fetchedAt: data.fetchedAt
  };
}


/* ---------------------------------------------------------
   FETCH ALL BADGES
--------------------------------------------------------- */

async function doFetchAll() {

  if (isFetching) {
    return;
  }

  if (badges.length === 0) {

    statusEl.textContent =
      'No badges to fetch. Paste badges and click Parse & Track.';

    return;
  }

  const toFetch = badges.filter(b => b.id);

  if (toFetch.length === 0) {

    statusEl.textContent =
      'No badge IDs present.';

    return;
  }

  isFetching = true;

  fetchBtn.disabled = true;

  progressBar.style.width = '0%';

  let fetched = 0;
  let failed = 0;

  statusEl.textContent =
    `Fetching ${toFetch.length} badges...`;

  try {

    for (const badge of toFetch) {

      try {

        // Pace requests.
        await sleep(300);

        const result =
          await fetchBadge(badge.id);

        badge.count = result.count;
        badge.lastFetched = Date.now();
        badge.error = null;

      } catch (error) {

        failed++;

        badge.error = error.message;

        // Keep the previous successful count.
        // Don't replace it with zero or null.
      }

      fetched++;

      const percentage =
        Math.round(
          (fetched / toFetch.length) * 100
        );

      progressBar.style.width =
        percentage + '%';

      statusEl.textContent =
        `Fetching ${fetched}/${toFetch.length}` +
        (failed
          ? ` — ${failed} failed`
          : '');

      renderTable();
    }

    statusEl.textContent =
      `Fetch complete — ${fetched} checked` +
      (failed
        ? `, ${failed} failed.`
        : '.');

  } finally {

    isFetching = false;

    fetchBtn.disabled = false;
  }
}


/* ---------------------------------------------------------
   PARSE BUTTON
--------------------------------------------------------- */

parseBtn.addEventListener('click', () => {

  badges =
    parseInputText(inputArea.value);

  renderTable();
});


/* ---------------------------------------------------------
   CLEAR
--------------------------------------------------------- */

clearBtn.addEventListener('click', () => {

  badges = [];

  inputArea.value = '';

  renderTable();
});


/* ---------------------------------------------------------
   SAMPLE
--------------------------------------------------------- */

loadSample.addEventListener('click', () => {

  const sample = [
    'The Floor Is LAVA!,You played!,724041081',
    'Livetopia 🏡 RP,Welcome to Livetopia,593806233',
    'Easy Obby,Welcome!,496714103',
    'DOORS 👁️,Welcome,468288140',
    'Color Block,Welcome to Color Block!,421144110'
  ].join('\n');

  inputArea.value = sample;

  badges =
    parseInputText(sample);

  renderTable();
});


/* ---------------------------------------------------------
   AUTO REFRESH
--------------------------------------------------------- */

toggleAuto.addEventListener('click', () => {

  if (autoTimer) {

    clearInterval(autoTimer);

    autoTimer = null;

    toggleAuto.textContent = 'Start';

    toggleAuto.classList.add('ghost');

    statusEl.textContent =
      'Auto-refresh stopped.';

    return;
  }

  const minutes =
    Math.max(
      1,
      parseInt(
        intervalInput.value || '5',
        10
      )
    );

  const milliseconds =
    minutes * 60 * 1000;

  // Fetch immediately.
  doFetchAll();

  // Then keep refreshing.
  autoTimer =
    setInterval(
      () => doFetchAll(),
      milliseconds
    );

  toggleAuto.textContent = 'Stop';

  toggleAuto.classList.remove('ghost');

  statusEl.textContent =
    `Auto-refresh enabled — every ${minutes} minute(s).`;
});


/* ---------------------------------------------------------
   COPY BADGE ID
--------------------------------------------------------- */

tbody.addEventListener('click', event => {

  const row =
    event.target.closest('tr');

  if (!row) {
    return;
  }

  const code =
    row.querySelector(
      'td:nth-child(4) code'
    );

  if (!code) {
    return;
  }

  navigator.clipboard
    ?.writeText(code.textContent || '')
    .then(() => {

      statusEl.textContent =
        'BadgeID copied to clipboard.';

      setTimeout(
        renderTable,
        1200
      );

    })
    .catch(() => {});
});
