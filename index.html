<script>
const inputArea = document.getElementById('inputArea');
const parseBtn = document.getElementById('parseBtn');
const fetchBtn = document.getElementById('fetchBtn');
const clearBtn = document.getElementById('clearBtn');
const loadSample = document.getElementById('loadSample');
const statusEl = document.getElementById('status');
const table = document.getElementById('badgesTable');
const tbody = table.querySelector('tbody');
const progressBar = document.getElementById('progressBar');
const toggleAuto = document.getElementById('toggleAuto');
const intervalInput = document.getElementById('intervalInput');

let badges = [];
let autoTimer = null;
let isFetching = false;


/*
 * Roblox's actual API:
 *
 * https://badges.roblox.com/v1/badges/{badgeId}
 *
 * We use RoProxy only because a browser page cannot reliably
 * make a cross-origin request directly to Roblox.
 */
const BADGE_API =
  'https://badges.roproxy.com/v1/badges/';


/* =========================================================
   PARSE INPUT
========================================================= */

function parseInputText(text) {

  const lines = text
    .split(/\r?\n/)
    .map(line => line.trim())
    .filter(Boolean);

  const parsed = [];

  for (const line of lines) {

    /*
     * Expected:
     * Game,Badge Name,BadgeID
     */

    const parts =
      line.match(/(".*?"|[^,]+)(?=\s*,|\s*$)/g)
        ?.map(s =>
          s.replace(/^"|"$/g, '').trim()
        ) || [];

    const game = parts[0] || '';
    const name = parts[1] || '';

    /*
     * Third column is ALWAYS the Badge ID.
     *
     * Do not try to determine whether it's a count.
     * Your input format already tells us it's an ID.
     */
    const id =
      (parts[2] || '').replace(/\D/g, '');

    if (game || name || id) {

      parsed.push({
        game: game,
        name: name,
        id: id,
        count: null,
        lastFetched: null,
        error: null
      });

    }
  }

  return parsed;
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

  tbody.innerHTML = '';

  if (badges.length === 0) {

    table.style.display = 'none';

    statusEl.textContent =
      'No badges parsed yet.';

    return;
  }

  table.style.display = '';

  /*
   * Highest awarded count first.
   */
  const sorted = [...badges].sort((a, b) => {

    const ca =
      a.count == null
        ? -1
        : Number(a.count);

    const cb =
      b.count == null
        ? -1
        : Number(b.count);

    return cb - ca;
  });


  sorted.forEach((b, index) => {

    const tr =
      document.createElement('tr');

    tr.innerHTML = `

      <td>${index + 1}</td>

      <td>
        ${escapeHtml(b.game || '—')}
      </td>

      <td>
        ${escapeHtml(b.name || '—')}
      </td>

      <td>
        ${
          b.id
            ? `<code>${escapeHtml(b.id)}</code>`
            : `<span class="small">missing</span>`
        }
      </td>

      <td class="count">
        ${
          b.count == null
            ? '—'
            : numberWithCommas(b.count)
        }
      </td>

      <td>
        ${
          b.lastFetched
            ? new Date(
                b.lastFetched
              ).toLocaleString()
            : '—'
        }
      </td>

    `;

    /*
     * Show the error when hovering the row.
     */
    if (b.error) {
      tr.title = b.error;
    }

    tbody.appendChild(tr);
  });


  const ids =
    badges.filter(b => b.id).length;

  const errors =
    badges.filter(b => b.error).length;

  statusEl.textContent =
    `Parsed ${badges.length} badges. ` +
    `${ids} have IDs.` +
    (
      errors
        ? ` ${errors} failed.`
        : ''
    );
}


/* =========================================================
   HELPERS
========================================================= */

function numberWithCommas(value) {

  if (value == null) {
    return value;
  }

  return Number(value).toLocaleString();
}


function escapeHtml(value) {

  return String(value).replace(
    /[&<>"']/g,
    char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char])
  );
}


function sleep(ms) {

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );
}


/* =========================================================
   GET BADGE FROM ROBLOX API
========================================================= */

async function fetchBadge(badgeId) {

  if (!badgeId) {
    throw new Error(
      'Missing badge ID'
    );
  }

  /*
   * This ultimately requests:
   *
   * https://badges.roblox.com/v1/badges/123456789
   *
   * through RoProxy.
   */
  const url =
    BADGE_API +
    encodeURIComponent(badgeId);


  const response =
    await fetch(url, {
      method: 'GET',

      /*
       * Don't allow the browser to use
       * an old cached API response.
       */
      cache: 'no-store',

      headers: {
        'Accept': 'application/json'
      }
    });


  if (!response.ok) {

    throw new Error(
      `HTTP ${response.status}`
    );
  }


  const data =
    await response.json();


  /*
   * Roblox response structure:
   *
   * {
   *   ...
   *   "statistics": {
   *      "awardedCount": 123
   *   }
   * }
   */

  const awarded =
    data?.statistics?.awardedCount;


  if (
    typeof awarded !== 'number'
  ) {

    throw new Error(
      'awardedCount not found in Roblox response'
    );
  }


  return awarded;
}


/* =========================================================
   FETCH EVERYTHING
========================================================= */

async function doFetchAll() {

  if (isFetching) {
    return;
  }

  if (badges.length === 0) {

    statusEl.textContent =
      'No badges to fetch. Parse your badges first.';

    return;
  }


  const toFetch =
    badges.filter(
      badge => badge.id
    );


  if (toFetch.length === 0) {

    statusEl.textContent =
      'No badge IDs present.';

    return;
  }


  isFetching = true;

  fetchBtn.disabled = true;

  progressBar.style.width =
    '0%';


  let completed = 0;
  let failed = 0;


  statusEl.textContent =
    `Fetching ${toFetch.length} badges...`;


  try {

    /*
     * Sequential requests prevent us from
     * hammering the proxy.
     */
    for (const badge of toFetch) {

      try {

        await sleep(250);

        const count =
          await fetchBadge(
            badge.id
          );


        /*
         * THIS is the important part.
         *
         * Replace the old value with the
         * current Roblox awardedCount.
         */
        badge.count = count;

        badge.lastFetched =
          Date.now();

        badge.error = null;

      } catch (error) {

        failed++;

        badge.error =
          error.message;

        /*
         * Keep the last known count rather
         * than destroying it when one request
         * fails.
         */
      }


      completed++;


      const percent =
        Math.round(
          completed /
          toFetch.length *
          100
        );


      progressBar.style.width =
        percent + '%';


      statusEl.textContent =
        `Fetching ${completed}/${toFetch.length}` +
        (
          failed
            ? ` — ${failed} failed`
            : ''
        );


      renderTable();
    }


    statusEl.textContent =
      `Fetch complete — ${completed} badges checked` +
      (
        failed
          ? `, ${failed} failed.`
          : '.'
      );

  } finally {

    isFetching = false;

    fetchBtn.disabled = false;
  }
}


/* =========================================================
   BUTTONS
========================================================= */

parseBtn.addEventListener(
  'click',
  () => {

    badges =
      parseInputText(
        inputArea.value
      );

    renderTable();
  }
);


clearBtn.addEventListener(
  'click',
  () => {

    badges = [];

    inputArea.value = '';

    renderTable();
  }
);


loadSample.addEventListener(
  'click',
  () => {

    const sample = [
      'The Floor Is LAVA!,You played!,724041081',
      'Livetopia 🏡 RP,Welcome to Livetopia,593806233',
      'Easy Obby,Welcome!,496714103',
      'DOORS 👁️,Welcome,468288140',
      'Color Block,Welcome to Color Block!,421144110'
    ].join('\n');


    inputArea.value =
      sample;


    badges =
      parseInputText(
        sample
      );


    renderTable();
  }
);


fetchBtn.addEventListener(
  'click',
  doFetchAll
);


/* =========================================================
   AUTO REFRESH
========================================================= */

toggleAuto.addEventListener(
  'click',
  () => {

    if (autoTimer) {

      clearInterval(
        autoTimer
      );

      autoTimer = null;

      toggleAuto.textContent =
        'Start';

      toggleAuto.classList.add(
        'ghost'
      );

      statusEl.textContent =
        'Auto-refresh stopped.';

      return;
    }


    const minutes =
      Math.max(
        1,
        parseInt(
          intervalInput.value || '5',
          10
        )
      );


    const interval =
      minutes *
      60 *
      1000;


    /*
     * Fetch immediately.
     */
    doFetchAll();


    /*
     * Then keep updating.
     */
    autoTimer =
      setInterval(
        () => doFetchAll(),
        interval
      );


    toggleAuto.textContent =
      'Stop';

    toggleAuto.classList.remove(
      'ghost'
    );


    statusEl.textContent =
      `Auto-refresh enabled — every ${minutes} minute(s).`;
  }
);


/* =========================================================
   COPY BADGE ID
========================================================= */

tbody.addEventListener(
  'click',
  event => {

    const tr =
      event.target.closest('tr');

    if (!tr) {
      return;
    }


    const code =
      tr.querySelector(
        'td:nth-child(4) code'
      );


    if (!code) {
      return;
    }


    navigator.clipboard
      ?.writeText(
        code.textContent || ''
      )
      .then(() => {

        statusEl.textContent =
          'BadgeID copied to clipboard.';

        setTimeout(
          () => renderTable(),
          1200
        );

      })
      .catch(() => {});
  }
);
